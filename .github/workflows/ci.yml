name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PhpManager/PhpManager.csproj

      - name: Build
        run: dotnet build PhpManager/PhpManager.csproj -c Release --no-restore

      - name: Publish
        run: >
          dotnet publish PhpManager/PhpManager.csproj
          -c Release
          -r win-x64
          --self-contained
          -p:PublishSingleFile=true
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-manager-win-x64
          path: publish/
          retention-days: 7
