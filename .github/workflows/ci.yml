name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        id: dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Build output is keyed on the exact app source + SDK version. A cache is only
      # saved when the job succeeds, so a hit means this exact source already built
      # and published cleanly and the whole build can be skipped.
      # GitHub scopes caches by branch: a cache saved on develop/main is readable by
      # PRs targeting that branch (and main's cache by everything), but not by
      # unrelated feature branches.
      - name: Restore cached build output
        id: build-cache
        uses: actions/cache@v6
        with:
          path: publish
          key: publish-${{ runner.os }}-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('PhpManager/**', '!PhpManager/bin/**', '!PhpManager/obj/**') }}

      # Only needed on a build-cache miss; speeds up restore when only source changed.
      - name: Cache NuGet packages
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('PhpManager/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: dotnet restore PhpManager/PhpManager.csproj

      - name: Build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: dotnet build PhpManager/PhpManager.csproj -c Release --no-restore

      - name: Publish
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: >
          dotnet publish PhpManager/PhpManager.csproj
          -c Release
          -r win-x64
          --self-contained
          -p:PublishSingleFile=true
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-manager-win-x64
          path: publish/
          retention-days: 7
