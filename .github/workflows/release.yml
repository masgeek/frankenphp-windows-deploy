name: Publish Release

# Dispatched by bump-and-tag.yml right after it creates the tag and a DRAFT release.
# GitHub release immutability locks a release's assets once it is published, so the
# release stays a draft until the zip is uploaded, then this workflow publishes it.
# Draft releases don't fire `release: published`, hence the explicit dispatch.
#
# Can also be run manually for an existing tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag/version to build and publish (e.g. 1.0.0)'
        required: true

# Releases are always written by the munywele-bot GitHub App (same App token as
# bump-and-tag.yml), so the bot owns the release, its asset and its publication.
permissions:
  contents: read        # release writes use the munywele-bot App token, not GITHUB_TOKEN
  id-token: write       # required for build provenance attestation
  attestations: write   # required for build provenance attestation

concurrency:
  group: publish-release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Validate version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # The tag (created by bump-and-tag.yml from commit messages) is the
          # source of truth for the version, not the csproj. It is injected at
          # build time via -p:Version and never committed back to git.
          $ver = $env:INPUT_VERSION
          if ($ver -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$ver' is not a plain semver version (expected e.g. 1.2.3)."
          }
          Write-Host "Version: $ver"
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.version.outputs.version }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PhpManager/PhpManager.csproj

      - name: Build
        run: dotnet build PhpManager/PhpManager.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Publish (self-contained single file)
        run: >
          dotnet publish PhpManager/PhpManager.csproj
          -c Release
          -r win-x64
          --self-contained
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Smoke test (exe exists and carries the release version)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The app is a WPF GUI, so don't launch it — inspect the binary instead.
          $exe = Get-Item "publish/php-manager.exe"
          Write-Host "$($exe.Name): $($exe.Length) bytes, version $($exe.VersionInfo.ProductVersion)"
          if (-not $exe.VersionInfo.ProductVersion.StartsWith($env:VERSION)) {
            throw "Built version '$($exe.VersionInfo.ProductVersion)' does not match release '$env:VERSION'."
          }

      - name: Package
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = "php-manager-$env:VERSION-win-x64.zip"
          Compress-Archive -Path "publish/*" -DestinationPath $zip
          Get-Item $zip | Select-Object Name, Length
          echo "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.package.outputs.zip }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-zip
          path: ${{ steps.package.outputs.zip }}

      - name: Attach zip to the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          # A manual run may happen before any release exists for the tag; create it
          # as a draft so it stays editable until the asset is attached.
          gh release view $env:VERSION *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:VERSION --draft --title "PHP Manager $env:VERSION" --generate-notes --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "Failed to create draft release $env:VERSION" }
          }
          $isDraft = gh release view $env:VERSION --json isDraft -q .isDraft
          if ($isDraft -ne 'true') {
            throw "Release $env:VERSION is already published; its assets are immutable. Refusing to continue."
          }
          gh release upload $env:VERSION $env:ZIP --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload $env:ZIP" }

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
          REPO: ${{ github.repository }}
        run: |
          # Publishing is the last step: once published, the release is immutable.
          # Releases have no comments (unlike issues/PRs), so the download details
          # go into the notes, before publishing.
          $notes = gh release view $env:VERSION --json body -q .body
          if ($notes -notmatch 'SHA-256:') {
            $sha = (Get-FileHash $env:ZIP -Algorithm SHA256).Hash.ToLower()
            $footer = @(
              '',
              '---',
              '### Download',
              ('**{0}** - Windows 10/11 x64, self-contained (no .NET runtime required).' -f $env:ZIP),
              '',
              ('SHA-256: `{0}`' -f $sha),
              '',
              'Verify the build provenance:',
              '```',
              ('gh attestation verify {0} --repo {1}' -f $env:ZIP, $env:REPO),
              '```'
            ) -join "`n"
            $notes = "$notes`n$footer"
          }
          gh release edit $env:VERSION --notes $notes --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish release $env:VERSION" }
