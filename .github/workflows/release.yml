name: Release

# Triggered by the tag that BumpVersion pushes as munywele-bot (CI has already passed
# on main at that point). Can also be run manually for a specific version.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $ver = if ($env:REF_TYPE -eq "tag") { $env:REF_NAME } else { $env:INPUT_VERSION }
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: '$ver'" }
          Write-Host "Version: $ver"
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          dotnet publish PhpManager/PhpManager.csproj
          -c Release
          -r win-x64
          --self-contained
          -p:PublishSingleFile=true
          -p:Version=$env:VERSION
          -o publish

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          Compress-Archive -Path "publish/*" -DestinationPath "php-manager-$env:VERSION-win-x64.zip"
          Get-Item "php-manager-$env:VERSION-win-x64.zip" | Select-Object Name, Length

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: php-manager-*-win-x64.zip
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: package

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PHP Manager ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: php-manager-${{ needs.build.outputs.version }}-win-x64.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
