name: Publish Release

on:
  release:
    # Published only — "created"/"prereleased" would double-fire alongside
    # "published" for a non-draft release and build the same version twice.
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true

# Deliberately release-only, not also `push: tags` — bump-and-tag.yml creates
# the tag and the release together on every push to main, so listening to both
# would build and upload the same version twice (a guaranteed race).
#
# Releases are always created by the munywele-bot GitHub App: bump-and-tag.yml
# creates it on every push to main, and the manual-dispatch fallback below uses
# the same App token. Events caused by GITHUB_TOKEN don't trigger workflows, so
# the App token is also what makes this workflow fire.

permissions:
  contents: read        # release writes use the munywele-bot App token, not GITHUB_TOKEN
  id-token: write       # required for build provenance attestation
  attestations: write   # required for build provenance attestation

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # The tag (created by bump-and-tag.yml from commit messages) is the
          # source of truth for the version, not the csproj. It is injected at
          # build time via -p:Version and never committed back to git.
          $ver = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:INPUT_VERSION }
          if ($ver -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$ver' is not a plain semver version (expected e.g. 1.2.3)."
          }
          Write-Host "Version: $ver"
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore PhpManager/PhpManager.csproj

      - name: Build
        run: dotnet build PhpManager/PhpManager.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Publish (self-contained single file)
        run: >
          dotnet publish PhpManager/PhpManager.csproj
          -c Release
          -r win-x64
          --self-contained
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Smoke test (exe exists and carries the release version)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The app is a WPF GUI, so don't launch it — inspect the binary instead.
          $exe = Get-Item "publish/php-manager.exe"
          Write-Host "$($exe.Name): $($exe.Length) bytes, version $($exe.VersionInfo.ProductVersion)"
          if (-not $exe.VersionInfo.ProductVersion.StartsWith($env:VERSION)) {
            throw "Built version '$($exe.VersionInfo.ProductVersion)' does not match release '$env:VERSION'."
          }

      - name: Package
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = "php-manager-$env:VERSION-win-x64.zip"
          Compress-Archive -Path "publish/*" -DestinationPath $zip
          Get-Item $zip | Select-Object Name, Length
          echo "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package.outputs.zip }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-zip
          path: ${{ steps.package.outputs.zip }}

      - name: Attach zip to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          # Manual dispatch may run before any release exists for the version.
          gh release view $env:VERSION *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:VERSION --title "PHP Manager $env:VERSION" --generate-notes --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $env:VERSION" }
          }
          gh release upload $env:VERSION $env:ZIP --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload $env:ZIP" }

      - name: Note build status on the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          # Releases have no comments (unlike issues/PRs), so append the status
          # to the release notes instead.
          $notes = gh release view $env:VERSION --json body -q .body
          $status = "`n`n---`n📦 ``$env:ZIP`` built and attached by this workflow (build provenance attested)."
          gh release edit $env:VERSION --notes "$notes$status"
